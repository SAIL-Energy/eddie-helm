# General
bootstrap.servers=eddie-worker.projekte.fh-hagenberg.at:5001
group.id=univie-kafka-client-group
client.id=univie-kafka-client

# Security
security.protocol=SASL_SSL
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username='univie-kafka-client' password='';
sasl.mechanism=SCRAM-SHA-512

# Application Specific, you have to adapt these values for your application
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
auto.offset.reset=earliest
