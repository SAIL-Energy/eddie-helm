<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>EDDIE Button</title>

    <script type="module" src="https://eddie-worker.projekte.fh-hagenberg.at/univie/eddie/lib/eddie-components.js"></script>

    <style>
        form {
            margin-top: 1.5rem;
            display: grid;
            justify-items: start;
            gap: 0.5rem;
        }

        span + input,
        span + select {
            margin-top: 0.1rem;
            display: block;
        }
    </style>
</head>
<body>
<eddie-connect-button
        data-need-id="1"
        connection-id="1"
></eddie-connect-button>

<form>
    <label>
        <span>Data need</span>
        <select name="data-need-id" autocomplete="off"></select>
    </label>
    <label>
        <span>Connection ID</span>
        <input type="text" name="connection-id" id="connection-id" />
    </label>
</form>

<script type="module">
    const coreUrl = "https://eddie-worker.projekte.fh-hagenberg.at/univie/eddie";

    // Fetch data needs from the API
    const dataNeeds = await fetch(`${coreUrl}/data-needs/api`).then(
        (response) => response.json()
    );

    // Set button attributes and form values from query parameters
    const button = document.querySelector("eddie-connect-button");
    const inputs = document.querySelectorAll("input, select");

    // Populate the select element with data needs
    const select = document.querySelector("select[name='data-need-id']");
    let first = true;
    for (const { id, name } of dataNeeds) {
        if (first) {
            button.setAttribute("data-need-id", id)
            button.replaceWith(button.cloneNode());
            first = false;
        }
        const option = document.createElement("option");
        option.value = id;
        option.textContent = name;
        select.appendChild(option);
    }

    inputs.forEach((input) => {
        input.addEventListener("change", (event) => {
            const { name, value, type, checked } = event.target;
            button.setAttribute(name, type === "checkbox" ? checked : value);
            button.replaceWith(button.cloneNode());
        });
    });

    // Log all status events for debugging purposes
    document.addEventListener("eddie-request-status", (event) => {
        console.debug(event.detail.status, event.detail);
    });

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = (Math.random() * 16) | 0;
            const v = c === 'x' ? r : (r & 0x3) | 0x8;
            return v.toString(16);
        });
    }

    // Set the generated UUID as the value of the input
    document.getElementById('connection-id').value = generateUUID();
</script>
</body>
</html>
