operator:
  manager:
    collectorImage:
      repository: "otel/opentelemetry-collector"

collector:
  ports:
    metrics:
      enabled: true
      containerPort: 9464
      servicePort: 9464
      protocol: TCP

  mode: deployment

  image:
    repository: "otel/opentelemetry-collector"

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      debug: {}
      otlphttp/loki:
        endpoint: http://eddie-monitoring-loki:3100/otlp
      prometheus:
        endpoint: 0.0.0.0:9464

    service:
      pipelines:
#        traces:
#          receivers: [otlp]
#          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]

loki:
  loki:
    auth_enabled: false
    limits_config:
      allow_structured_metadata: true
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    ingester:
      chunk_encoding: snappy
    tracing:
      enabled: true
    querier:
      max_concurrent: 2

  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1

  # Enable minio for storage
  minio:
    enabled: true

  # Zero out replica counts of other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0

prometheus:
  alertmanager:
    enabled: false

  serverFiles:
    prometheus.yml:
      rule_files:
        - /etc/config/recording_rules.yml
        - /etc/config/alerting_rules.yml
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets:
                - eddie-monitoring-collector:9464