apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-ingress
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
  {{- if eq .Values.ingress.tls.enabled "true" }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certificateIssuer }}
  {{- end }}

spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /{{ .Values.ingress.basePath }}/example-app
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-example-app
                port:
                  number: 8081
          - path: /{{ .Values.ingress.basePath }}/eddie
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-core
                port:
                  number: 8080
          - path: /{{ .Values.ingress.basePath }}/eddie/outbound-connectors
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-core
                port:
                  number: 9090
{{- if eq .Values.ingress.tls.enabled "true"}}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Release.Name }}-tls
{{- end }}
