apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-core-secret
spec:
  encryptedData:
    jwtHmacSecret: {{ .Values.core.encryptedJwtHmacSecret }}
  template:
    metadata:
      name: {{ .Release.Name }}-core-secret
      labels:
      {{- include "eddie.labels" . | indent 6 }}
    type: Opaque
