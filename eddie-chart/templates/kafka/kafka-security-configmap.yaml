apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-security-configmap
data:
  kafka_server_jaas.conf: |-
    KafkaServer {
      org.apache.kafka.common.security.scram.ScramLoginModule required
      username="admin"
      password="{{ .Values.kafka.adminPassword }}";
    };
    Client {};
  client.properties: |-
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=SCRAM-SHA-512
    sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="{{ .Values.kafka.adminPassword }}";