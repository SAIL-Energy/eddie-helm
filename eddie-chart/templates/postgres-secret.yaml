apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-postgres-secret
spec:
  encryptedData:
    username: {{ .Values.postgres.encryptedUsername}}
    password: {{ .Values.postgres.encryptedPassword }}
  template:
    metadata:
      name: {{ .Release.Name }}-postgres-secret
      labels:
      {{- include "eddie.labels" . | indent 6 }}
    type: Opaque
