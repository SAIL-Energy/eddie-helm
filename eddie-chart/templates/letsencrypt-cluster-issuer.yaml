{{- if eq .Values.ingress.tls.enabled "true" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-letsencrypt-prod
  labels:
  {{- include "eddie.labels" . | indent 4 }}
spec:
  acme:
    email: {{ .Values.ingress.tls.letsEncryptProd.email }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ .Release.Name }}-letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: traefik
{{- end }}