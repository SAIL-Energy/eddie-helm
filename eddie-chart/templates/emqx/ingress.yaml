{{- if gt (default "0" .Values.emqx.replicaCount | int) 0 -}}
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-emqx-strip-prefix-mw
spec:
  stripPrefix:
    forceSlash: false
    prefixes:
      - "/{{ .Release.Namespace }}/emqx-dashboard"
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-emqx-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-emqx-strip-prefix-mw@kubernetescrd
spec:
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: {{ if .Values.ingress.basePath }}/{{ .Values.ingress.basePath }}{{ end }}/emqx-dashboard
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-emqx
            port:
              number: 18083
{{- if eq .Values.ingress.tls.enabled "true"}}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Release.Name }}-tls
{{- end }}
{{- end }}
