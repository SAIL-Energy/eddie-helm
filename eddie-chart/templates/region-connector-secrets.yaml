{{- if eq .Values.regionConnectors.atEda.enabled "true" }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-region-connector-secrets
spec:
  encryptedData:
{{- if eq .Values.regionConnectors.atEda.enabled "true" }}
    pontonUsername: {{ .Values.regionConnectors.atEda.pontonMessenger.encryptedUsername }}
    pontonPassword: {{ .Values.regionConnectors.atEda.pontonMessenger.encryptedPassword }}
{{- end }}
{{- if eq .Values.regionConnectors.esDatadis.enabled "true" }}
    datadisUsername: {{ .Values.regionConnectors.esDatadis.encryptedUsername }}
    datadisPassword: {{ .Values.regionConnectors.esDatadis.encryptedPassword }}
{{- end }}
{{- if eq .Values.regionConnectors.fiFingrid.enabled "true" }}
    fingridKeystorePassword: {{ .Values.regionConnectors.fiFingrid.keystore.encryptedPassword }}
    fingridKeyAlias: {{ .Values.regionConnectors.fiFingrid.keystore.key.encryptedAlias }}
    fingridKeyPassword: {{ .Values.regionConnectors.fiFingrid.keystore.key.encryptedPassword }}
    fingridOrganisationUser: {{ .Values.regionConnectors.fiFingrid.organisation.encryptedUser }}
{{- end }}
{{- if eq .Values.regionConnectors.frEnedis.enabled "true" }}
    enedisClientId: {{ .Values.regionConnectors.frEnedis.client.encryptedId }}
    enedisClientSecret: {{ .Values.regionConnectors.frEnedis.client.encryptedSecret }}
{{- end }}
{{- if eq .Values.regionConnectors.nlMijnAansluiting.enabled "true" }}
    mijnAansluitingKeystorePassword: {{ .Values.regionConnectors.nlMijnAansluiting.keystore.encryptedPassword }}
    mijnAansluitingKeyAlias: {{ .Values.regionConnectors.nlMijnAansluiting.keystore.key.encryptedAlias }}
    mijnAansluitingKeyPassword: {{ .Values.regionConnectors.nlMijnAansluiting.keystore.key.encryptedPassword }}
    mijnAansluitingSingleKeyId: {{ .Values.regionConnectors.nlMijnAansluiting.single.encryptedKeyId }}
    mijnAansluitingContinuousKeyId: {{ .Values.regionConnectors.nlMijnAansluiting.continuous.encryptedKeyId }}
{{- end }}
{{- if eq .Values.regionConnectors.usGreenButton.enabled "true" }}
    greenButtonClientApiToken: {{ .Values.regionConnectors.usGreenButton.client.encryptedApiToken }}
    greenButtonWebhookSecret: {{ .Values.regionConnectors.usGreenButton.encryptedWebhookSecret }}
{{- range .Values.regionConnectors.usGreenButton.clients }}
    greenButton{{.name}}Id: {{ .encryptedId }}
    greenButton{{.name}}ClientSecret: {{ .encryptedSecret }}
{{- end }}
{{- end }}
  template:
    metadata:
      name: {{ .Release.Name }}-region-connector-secrets
      labels:
      {{- include "eddie.labels" . | indent 6 }}
    type: Opaque
{{- end }}
