apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-kafka-secret
spec:
  encryptedData:
    keystorePassword: {{ .Values.kafka.sslStores.keystore.encryptedPassword}}
    truststorePassword: {{ .Values.kafka.sslStores.truststore.encryptedPassword }}
  template:
    metadata:
      name: {{ .Release.Name }}-kafka-secret
      labels:
      {{- include "eddie.labels" . | indent 6 }}
    type: Opaque
