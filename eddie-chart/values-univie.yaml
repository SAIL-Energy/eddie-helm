sealed-secrets:
  namespace: "univie"
  fullnameOverride: "sealed-secrets-controller-univie"
  rbac:
    create: true
    clusterRoleName: "univie-secrets-unsealer"
ingress:
  host: "eddie-demo.projekte.fh-hagenberg.at"
  basePath: "univie"
  tls:
    enabled: "true"
    clusterIssuer: "letsencrypt-prod"
postgres:
  replicaCount: 1
  encryptedUsername: ""
  encryptedPassword: ""
  storageSize: "25Gi"
kafka:
  replicaCount: 1
  externalPort: 5001
  storageSize: "25Gi"
  sslStores:
    secretName: "kafka-ssl-stores"
    keystore:
      encryptedPassword: ""
    truststore:
      encryptedPassword: ""
core:
  version: "release-snapshot20241218"
  replicaCount: 1
  ponton:
    storageSize: "5Gi"
  encryptedJwtHmacSecret: ""
  dataNeedConfig:
    datasource: "DATABASE"

exampleApp:
  replicaCount: 0

