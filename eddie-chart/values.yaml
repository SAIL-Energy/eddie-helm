ghcrImagePullSecrets:
  name: "ghcr-secret"

ingress:
  basePath: ""
  host: "localhost"
  tls:
    enabled: "false"
    clusterIssuer: ""

postgres:
  replicaCount: 0
  database: "eddie"
  encryptedPassword: ""
  encryptedUsername: ""
  version: "latest"
  port: 5432
  storageSize: "1Gi"

kafka:
  replicaCount: 0
  storageSize: "5Gi"
  version: "3.6"
  externalPort: 9094
  adminPassword: "admin"
  sslStores:
    secretName: ""
    keystore:
      encryptedPassword: ""
    truststore:
      encryptedPassword: ""
  topics:
    - name: permission-market-documents
      replicationFactor: 1
      partitions: 1
    - name: validated-historical-data
      replicationFactor: 1
      partitions: 1
    - name: terminations
      replicationFactor: 1
      partitions: 1
    - name: accounting-point-market-documents
      replicationFactor: 1
      partitions: 1
    - name: raw-data-in-proprietary-format
      replicationFactor: 1
      partitions: 1
    - name: status-messages
      replicationFactor: 1
      partitions: 1
  users:
    - name: eddie-core
      password: eddie-core
      consumeTopics:
        - name: validated-historical-data
          group: eddie-core
        - name: permission-market-documents
          group: eddie-core
        - name: terminations
          group: termination-group
      produceTopics:
        - name: validated-historical-data
        - name: permission-market-documents
        - name: terminations
        - name: accounting-point-market-documents
        - name: raw-data-in-proprietary-format
        - name: status-messages
    - name: example-app
      password: example-app
      consumeTopics:
        - name: validated-historical-data
          group: example-app-vhd
        - name: permission-market-documents
          group: example-app-status
      produceTopics:
        - name: validated-historical-data
        - name: permission-market-documents
        - name: terminations

exampleApp:
  replicaCount: 0
  version: "latest"
  kafkaUser:
    username: "example-app"
    password: "example-app"

